<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>X Bookmark Shelf</title>
  <script type="module" crossorigin src="./manager.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/manager.css">
</head>
<body>
  <main>
    <header>
      <h1>Saved Shelf</h1>
      <div class="header-controls">
        <label class="sr-only" for="language" data-i18n="language">表示言語</label>
        <select id="language">
          <option value="ja">日本語</option><option value="en">English</option><option value="zh-CN">简体中文</option>
        </select>
        <button id="open-tab" type="button" data-i18n="openList">一覧を別タブで開く</button>
      </div>
    </header>
    <p class="intro" data-i18n="intro">Xのブックマーク・いいねをSafariに保存します。</p>
    <div class="switch" role="tablist" aria-label="保存した項目の種類" data-i18n-aria="savedTypes">
      <button id="bookmark-tab" role="tab" aria-selected="true" data-i18n="bookmarks">ブックマーク</button>
      <button id="like-tab" role="tab" aria-selected="false" data-i18n="likes">いいね</button>
    </div>
    <div class="actions">
      <button id="sync" class="primary" data-i18n="syncBookmarks">ブックマークを取り込む</button>
      <button id="export" data-i18n="exportJson">JSONを書き出す</button>
      <button id="clear" class="danger" data-i18n="clearSaved">保存データを削除</button>
    </div>
    <dialog id="clear-dialog" aria-labelledby="clear-confirm-text">
      <p id="clear-confirm-text"></p>
      <div class="dialog-actions"><button id="cancel-clear" type="button" data-i18n="cancel">キャンセル</button><button id="confirm-clear" class="danger" type="button" data-i18n="delete">削除する</button></div>
    </dialog>
    <div class="sync-limits">
      <label><span data-i18n="maxItems">件数上限</span><input id="max-items" type="number" min="1" max="10000" data-i18n-placeholder="unlimited" placeholder="無制限"></label>
      <label><span data-i18n="months">対象期間（月）</span><input id="months" type="number" min="1" max="120" data-i18n-placeholder="allTime" placeholder="全期間" aria-describedby="range-note"></label>
    </div>
    <small id="range-note" data-i18n="rangeNote">投稿日で絞り込みます。投稿日が不明な投稿は対象外です。</small>
    <p id="status" role="status" aria-live="polite"></p>
    <label for="search" data-i18n="searchSaved">保存データを検索</label>
    <input id="search" type="search" data-i18n-placeholder="searchPlaceholder" placeholder="本文・投稿者・ID" autocomplete="off" />
    <div class="filters">
      <label data-i18n="postPeriod">投稿期間</label>
      <div class="dates"><input id="from-date" type="date" aria-label="開始日" data-i18n-aria="fromDate"><span>〜</span><input id="to-date" type="date" aria-label="終了日" data-i18n-aria="toDate"></div>
    </div>
    <div class="count"><span id="count">0件</span><button id="sort-toggle" type="button">ブックマーク順・新しい順</button></div>
    <section id="posts" aria-label="保存済み投稿" data-i18n-aria="savedPosts"></section>
  </main>
</body>
</html>
