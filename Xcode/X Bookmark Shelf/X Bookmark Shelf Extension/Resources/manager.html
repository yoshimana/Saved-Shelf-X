<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>X Bookmark Shelf</title>
  <script type="module" crossorigin src="./manager.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/manager.css">
</head>
<body>
  <main>
    <header><h1>Saved Shelf</h1><button id="open-tab" type="button">一覧を別タブで開く</button></header>
    <p class="intro">Xのブックマーク・いいねをSafariに保存します。</p>
    <div class="switch" role="tablist" aria-label="保存した項目の種類">
      <button id="bookmark-tab" role="tab" aria-selected="true">ブックマーク</button>
      <button id="like-tab" role="tab" aria-selected="false">いいね</button>
    </div>
    <div class="actions">
      <button id="sync" class="primary">ブックマークを取り込む</button>
      <button id="export">JSONを書き出す</button>
      <button id="clear" class="danger">保存データを削除</button>
    </div>
    <dialog id="clear-dialog" aria-labelledby="clear-confirm-text">
      <p id="clear-confirm-text"></p>
      <div class="dialog-actions"><button id="cancel-clear" type="button">キャンセル</button><button id="confirm-clear" class="danger" type="button">削除する</button></div>
    </dialog>
    <div class="sync-limits">
      <label>件数上限<input id="max-items" type="number" min="1" max="10000" placeholder="無制限"></label>
      <label>対象期間（月）<input id="months" type="number" min="1" max="120" placeholder="全期間" aria-describedby="range-note"></label>
    </div>
    <small id="range-note">投稿日で判定します（投稿日不明の投稿は除外）。</small>
    <p id="status" role="status" aria-live="polite"></p>
    <label for="search">保存データを検索</label>
    <input id="search" type="search" placeholder="本文・投稿者・ID" autocomplete="off" />
    <div class="filters">
      <label>投稿期間</label>
      <div class="dates"><input id="from-date" type="date" aria-label="投稿期間の開始日"><span>〜</span><input id="to-date" type="date" aria-label="投稿期間の終了日"></div>
    </div>
    <div class="count"><span id="count">0件</span><button id="sort-toggle" type="button">ブックマーク順・新しい順</button></div>
    <section id="posts" aria-label="保存済み投稿"></section>
  </main>
</body>
</html>
